schema: spec-driven

# Контекст проекта. Показывается AI при создании артефактов.
context: |
  Project Board — PWA-дашборд для управления проектами: универсальная платформа
  виджетов (вкладки, тайлинг/каскад, каталог) и первые модули — Гантт и чек-лист.
  Проект на стадии проектирования и раннего инструментария; продуктового кода ещё нет.

  Единица работы: одна задача PBT = один OpenSpec change = один PR.
  Имя change — lowercase kebab-case с ID задачи: pbt-006-widget-registry (задача PBT-006).

  Источники истины (сверяйтесь, не дублируйте содержание):
  - .context/project-decisions.md — согласованные решения, предложения (гипотезы) и открытые вопросы.
  - .context/tasks/README.md — реестр задач PBT-001–PBT-065, статусы и ссылки на PR.
  - .context/tasks/PBT-XXX.md — цель, границы PR, зависимости и DoD конкретной задачи.
  - .context/openspec-workflow.md — процесс: цикл задачи, места хранения, capability-имена.
  - .context/openspec-setup.md — версии инструментария и воспроизводимая настройка OpenSpec.

  Критично сохранять различие статусов из project-decisions.md:
  «Согласовано»/«Исходное требование» — подтверждённые решения;
  «Предложено» — гипотезы, не ставшие требованиями. Не выдавайте предложения
  за согласованные решения и не переносите технический выбор в требования:
  спорные правила закрываются задачами проектирования (Решение) и исследования (Исследование).

  Целевой стек (кандидат, не утверждён): React + TypeScript + Vite,
  монорепо apps/ + packages/. Библиотеки из решений — кандидаты, требующие проверки прототипом.

rules:
  proposal:
    - Пиши содержание артефактов по-русски; служебные заголовки OpenSpec (ADDED/MODIFIED/REMOVED/RENAMED, Requirements, Scenario, SHALL, GIVEN/WHEN/THEN) и заголовки секций шаблонов оставляй английскими.
    - Включай в proposal границы PR из карточки задачи PBT и явно указывай Non-goals.
    - 'Для tooling/docs/research-задач без изменения поведения продукта не выдумывай capabilities; используй skip_specs: true в .openspec.yaml change.'
    - Не вноси в требования технические решения — место для них design.md и ADR.
  specs:
    - Служебные заголовки — английские (ADDED Requirements, Requirement:, Scenario:, SHALL, GIVEN/WHEN/THEN); текст сценариев — русский.
    - Описывай наблюдаемое поведение, а не устройство реализации; используй имена capability из .context/openspec-workflow.md без ID задачи.
    - Не создавай specs для несуществующей функциональности; openspec/specs/ наполняется только принятыми изменениями.
  design:
    - Фиксируй технический выбор с альтернативами и причинами; явно отмечай, что является кандидатом, а что согласовано в project-decisions.md.
    - Для исследовательских задач описывай вопросы, входные данные, команды воспроизведения и форму результата (подходит / подходит с ограничениями / не подходит).
  tasks:
    - Разбивай работу на шаги одной задачи PBT с проверяемым результатом у каждого шага; не создавай новые самостоятельные задачи бэклога внутри tasks.md.
    - Включай шаги проверок (openspec validate --strict --no-interactive, тесты/сценарии по типу задачи) и обновления статуса в .context/tasks/README.md.
  apply:
    - Реализуй только выбранную задачу PBT; новые самостоятельные работы получай как отдельные коды задач, а не прячь в текущем PR.
    - Проверки доменных правил и целостности данных добавляй в PR самой функции.
  archive:
    - Архивируй change в ветке задачи с переносом delta specs в актуальные specs; для skip_specs-изменений — только перемещение в changes/archive/.
    - Перед архивацией убедись, что validate --strict проходит и DoD карточки выполнен.

operations:
  apply:
    guidance:
      - Отмечай выполненные шаги в openspec/changes/<change>/tasks.md и пункты DoD в карточке задачи.
      - К каждой задаче прикладывай команды и результаты проверок; для UI — скриншот или запись сценария.
  archive:
    guidance:
      - Статус задачи в .context/tasks/README.md переводи в In review с ссылкой на PR; Done — только после принятия PR владельцем.
