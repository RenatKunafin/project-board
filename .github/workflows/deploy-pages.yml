name: Publish release to Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Проверка коммита релиза
        id: release
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/verify-release.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка заметок выпуска
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run verify:release-notes -- --version="$RELEASE_TAG"
      - name: Проверки коммита тега
        run: |
          npm run verify:repository
          npm run lint
          npm run typecheck
          npm test
          npm install -g @fission-ai/openspec@1.11.0
          openspec validate --all --strict
      - name: Сборка и проверка Pages
        run: |
          npm run build:pages
          npm run verify:pages
          npx playwright install --with-deps chromium
          npm run test:pages
      - name: Проверенный артефакт
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/project-board/dist
          retention-days: 30
      - name: Коммит публикации
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: echo "Verified commit $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
